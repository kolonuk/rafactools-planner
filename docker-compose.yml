# Local dev only. See README.md "Environments and deployment" for the image.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SESSION_KEY: dev-only-session-key-change-me-32bytes-min
      CLAIM_DOMAIN: rafac.mod.gov.uk
      COOKIE_SECURE: "false" # plain http on localhost
      BASE_URL: http://localhost:8080
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: no-reply@rafactools-planner.local
      # To try a real provider locally, remove the three lines above and set,
      # for example (see the docs page "Set up email"):
      #   MAIL_PROVIDER: cloudflare   # or gmail, google-workspace, ses, smtp
      #   SMTP_PASS: ${SMTP_PASS}     # a secret: keep it in .env, never in this file
      #   MAIL_FROM: no-reply@your-domain
      #   SES_REGION: eu-west-2       # only for ses
    volumes:
      - app-data:/data
    depends_on:
      - mailpit

  # Catches outgoing mail locally instead of sending it — open
  # http://localhost:8025 to read the verification/invite emails.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

volumes:
  app-data:
