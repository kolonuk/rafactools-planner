{{define "content"}}
<h1>Log in</h1>
<form method="post" action="{{url "/login"}}" class="card">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label>Email
    <input type="email" name="email" required autofocus>
  </label>
  <label>Password
    <input type="password" name="password" required>
  </label>
  <label>Authenticator code <span class="muted">(only if you have set up two-step sign-in)</span>
    <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" pattern="[0-9 ]*">
  </label>
  {{template "turnstile" .}}
  <button type="submit">Log in</button>
</form>
<p class="muted"><a href="{{url "/forgot"}}">Forgot your password?</a></p>
<p class="muted">{{if .SignupsOpen}}New squadron? <a href="{{url "/claim"}}">Claim it</a>. {{end}}Invited by a squadron member? Use the link from their email.</p>
{{end}}
