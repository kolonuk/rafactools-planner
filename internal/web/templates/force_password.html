{{define "content"}}
<h1>Choose your own password</h1>
<p>You signed in with a temporary password that an owner of your squadron sent you. Choose your own password to continue; until you do, nothing else on the site is open to you.</p>
<form method="post" action="{{url "/account/password"}}" class="card">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label>The temporary password
    <input type="password" name="current_password" required autocomplete="current-password">
  </label>
  <label>Your new password
    <input type="password" name="new_password" required minlength="12" maxlength="72" autocomplete="new-password">
  </label>
  <p class="muted">12 to 72 characters.</p>
  <button type="submit">Save my password</button>
</form>
{{end}}
