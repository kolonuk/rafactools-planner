{{define "content"}}
<h1>Claim your squadron</h1>
<p class="muted">The first signup for a squadron creates it. Use your <code>snco.&lt;number&gt;@{{.ClaimDomain}}</code>
  or <code>oc.&lt;number&gt;@{{.ClaimDomain}}</code> address — that's where the squadron number comes from.
  Already have an account? <a href="{{url "/login"}}">Log in</a>.</p>
<form method="post" action="{{url "/claim"}}" class="card">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label>Squadron display name
    <input type="text" name="squadron_name" placeholder="1234 (Sample Town) Squadron">
  </label>
  <label>Your name (optional) — shown in member lists and suggested as an instructor
    <input type="text" name="display_name" maxlength="80" autocomplete="name">
  </label>
  <label>Email
    <input type="email" name="email" required placeholder="snco.1234@{{.ClaimDomain}}">
  </label>
  <label>Password
    <input type="password" name="password" required minlength="12">
  </label>
  <button type="submit">Claim squadron</button>
</form>
{{end}}
