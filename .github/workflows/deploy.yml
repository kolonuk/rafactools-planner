# Builds the image, smoke-tests it, pushes to GHCR tagged by branch, and —
# for main only — dispatches dadock's deploy workflow so the running stack
# picks up the new image. dev/test pushes stop at GHCR: there's no separate
# dev/test host wired up yet (see TODO.md "Three real environments").
name: Build and deploy

on:
  push:
    branches: [dev, test, main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rafactools-planner

jobs:
  build:
    name: Build, scan and push image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-12)"
          ENV_TAG="${{ github.ref_name }}"
          IMAGE_BASE="${REGISTRY}/${IMAGE_NAME}"
          echo "short_sha=${SHORT_SHA}"                       >> "$GITHUB_OUTPUT"
          echo "image_base=${IMAGE_BASE}"                     >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_BASE}:${ENV_TAG}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "env_tag=${ENV_TAG}"                           >> "$GITHUB_OUTPUT"
          # dadock's docker-compose.yml pins this service by a bare :latest
          # (same convention as johnwood/sbcwaste) — only main should ever
          # move that tag, so dev/test pushes don't silently become what
          # dadock's "1. Deploy docker stack" pulls.
          if [ "${ENV_TAG}" = "main" ]; then
            echo "extra_tags=${IMAGE_BASE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "extra_tags=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 18081:8080 \
            -e SESSION_KEY=ci-smoke-test-session-key-not-for-prod-use \
            -e COOKIE_SECURE=false \
            "${{ steps.meta.outputs.image_ref }}"
          code=""
          for i in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18081/health || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || { echo "/health did not return 200 (got $code)"; docker logs smoke; exit 1; }
          body="$(curl -s http://localhost:18081/health)"
          echo "$body" | grep -q '{"status": "ok"}' || { echo "/health body unexpected: $body"; docker logs smoke; exit 1; }
          docker rm -f smoke

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.image_ref }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ steps.meta.outputs.image_base }}:${{ steps.meta.outputs.env_tag }}-latest
            ${{ steps.meta.outputs.extra_tags }}
          cache-from: type=gha

      - name: Summary
        run: |
          echo "Pushed \`${{ steps.meta.outputs.image_ref }}\`" >> "$GITHUB_STEP_SUMMARY"

  cleanup-images:
    name: Clean up old container images
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: "rafactools-planner"
          package-type: "container"
          min-versions-to-keep: 10

  trigger-dadock-deploy:
    name: Reload the dadock stack (main only)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      # DADOCK_DEPLOY_TOKEN is a fine-grained PAT scoped to Actions:write on
      # kolonuk/dadock only, same secret/pattern used by sbcwaste.top and
      # johnwood.dev. Set it as a repo secret here to enable auto-redeploy;
      # without it this step just prints a reminder to pull manually.
      - name: Dispatch dadock deploy workflow
        env:
          GH_TOKEN: ${{ secrets.DADOCK_DEPLOY_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "DADOCK_DEPLOY_TOKEN not set - skipping dadock reload. Pull the new image manually." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run "1. Deploy docker stack" --repo kolonuk/dadock
