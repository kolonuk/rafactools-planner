# Runs on every push/PR to the three long-lived branches (dev -> test ->
# main promotion via PR). Build/vet/test first since they're fast and catch
# most breakage; security scanning after.
name: CI

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [dev, test, main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build, vet, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # Includes the operational tests in cmd/server, which build and run
      # the real binary (startup failures, signals, restart persistence).
      - name: Test (race, coverage)
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic
      - name: Coverage summary
        run: |
          {
            echo "### Test coverage"
            echo '```'
            go tool cover -func=coverage.out | tail -n 25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fuzz (short)
        run: go test ./internal/auth -run '^$' -fuzz FuzzParseClaimEmail -fuzztime 20s
      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Not gofmt'd:"; echo "$out"; exit 1; fi

  go-lint:
    name: Static analysis (staticcheck, gosec)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - run: staticcheck ./...
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
      # Medium+ severity only. cmd/genexamples is a dev-time generator that
      # writes local files, not part of the shipped server.
      - run: gosec -severity medium -exclude-dir=cmd/genexamples ./...

  frontend-lint:
    name: Frontend lint (CSS, rendered HTML)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Stylelint (CSS)
        run: npx --yes -p stylelint@16.10.0 -p stylelint-config-recommended@14.0.1 stylelint "internal/web/static/**/*.css"
      # Templates are Go templates (HTML linters can't parse {{ }}), so
      # this boots the server and validates the rendered public pages.
      - name: html-validate (rendered pages)
        run: go run ./cmd/devtools validate-html
      # The app ships no JavaScript and its CSP is script-src 'none'. Fail
      # if any appears so it's a conscious decision (add ESLint and a CSP
      # review at the same time).
      - name: No unreviewed JavaScript
        run: |
          js="$(git ls-files '*.js' '*.mjs' '*.ts' || true)"
          if [ -n "$js" ]; then echo "JavaScript added; add ESLint to this job and review the CSP:"; echo "$js"; exit 1; fi
          if grep -rEn '<script|javascript:| on[a-z]+="' internal/web/templates; then
            echo "Inline script/handlers in templates conflict with the CSP"; exit 1
          fi

  docs-check:
    name: Docs updated with user-visible changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      # The PR body is passed through the environment and read by the Go
      # tool as data; it is never interpolated into a shell command.
      - name: Require a docs change (or a stated reason)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: go run ./cmd/devtools docs-check

  workflow-lint:
    name: Lint GitHub workflows (actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7 -color

  govulncheck:
    name: Known-vulnerability scan (govulncheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  trivy-fs:
    name: Scan source for vulnerabilities (Trivy FS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          # vuln = dependencies, secret = committed credentials,
          # misconfig = Dockerfile / compose issues.
          scanners: "vuln,secret,misconfig"
          exit-code: "1"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  codeql:
    name: CodeQL (go)
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          category: "/language:go"
          # Uploading SARIF to GitHub's code-scanning UI needs GitHub
          # Advanced Security, which isn't available for a private repo on
          # this plan (confirmed: `security_and_analysis` comes back null
          # from the repos API) — upload always failed with "Code scanning
          # is not enabled for this repository", failing CI on every push
          # despite the scan itself succeeding. The analysis still runs and
          # still fails the job on its own terms; it just doesn't try to
          # push results somewhere this plan can't receive them.
          upload: false
