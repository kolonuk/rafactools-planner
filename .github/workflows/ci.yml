# Runs on every push/PR to the three long-lived branches (dev -> test ->
# main promotion via PR). Everything runs side by side; the image is built and
# checked alongside the tests and pushed only once every check has passed.
name: CI

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [dev, test, main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rafactools-planner

jobs:
  # What a change touches decides which jobs run. A change that only edits notes
  # (TODO.md, CHANGELOG.md, README.md, CONTRIBUTING.md, LICENSE, CLAUDE.md or
  # .claude/) skips the heavy jobs: they report "skipped", which branch
  # protection counts as passed, and the "Build, vet, test" check below accepts
  # skipped jobs only when this job said the change was light. Anything else,
  # including the workflows, the code, the docs pages (they are built into the
  # app) and a push that cannot be compared, runs everything.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Work out whether the change is only notes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          heavy() { echo "heavy=true" >> "$GITHUB_OUTPUT"; echo "Running everything: $1"; exit 0; }
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}...${PR_HEAD}"; base="$PR_BASE"
          elif [ "$EVENT" = "push" ] && [ "${PUSH_BEFORE//0/}" != "" ]; then
            range="${PUSH_BEFORE}..${SHA}"; base="$PUSH_BEFORE"
          else
            heavy "this run was not started by a push or a pull request"
          fi
          git cat-file -e "${base}^{commit}" 2>/dev/null || heavy "the earlier commit is not available to compare with"
          files="$(git diff --name-only "$range")" || heavy "the change could not be listed"
          [ -n "$files" ] || heavy "no files changed"
          while IFS= read -r f; do
            case "$f" in
              TODO.md|CHANGELOG.md|README.md|CONTRIBUTING.md|LICENSE|CLAUDE.md|.claude/*) ;;
              *) heavy "$f is not a notes file" ;;
            esac
          done <<< "$files"
          echo "heavy=false" >> "$GITHUB_OUTPUT"
          echo "Only notes changed: the heavy jobs are skipped."

  build-vet:
    name: Build, vet, format
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Not gofmt'd:"; echo "$out"; exit 1; fi

  # The web package's tests are by far the slowest (every test builds a site and
  # most make many requests, and the race detector multiplies that), so they are
  # split across two jobs that run side by side. The tests are shared out by
  # their position in the sorted list of test names; every test is in exactly one
  # half, and a test added later lands in one of them without anyone doing
  # anything.
  test-web:
    name: "Tests: web (race), half ${{ matrix.shard }} of 2"
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - name: Test this half of the web tests (race)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          go test -race -list '.' ./internal/web | grep -E '^(Test|Fuzz|Example)' | sort > "$RUNNER_TEMP/all.txt"
          names="$(awk -v s="$SHARD" 'NR % 2 == s % 2' "$RUNNER_TEMP/all.txt" | paste -sd'|' -)"
          [ -n "$names" ] || { echo "no tests found for half $SHARD"; exit 1; }
          echo "Half $SHARD runs $(echo "$names" | tr '|' ' ' | wc -w) of $(wc -l < "$RUNNER_TEMP/all.txt") web tests"
          go test ./internal/web -race -count=1 -run "^($names)$"

  test-rest:
    name: "Tests: other packages (race)"
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      # Includes the operational tests in cmd/server, which build and run
      # the real binary (startup failures, signals, restart persistence).
      - name: Test (race)
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v '/internal/web$')
          go test "${pkgs[@]}" -race -count=1

  # Coverage is measured on its own plain run (much faster than measuring it under
  # the race detector); the race jobs above do not measure it.
  coverage:
    name: Test coverage
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - name: Test (coverage)
        run: go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic
      - name: Coverage summary
        run: |
          {
            echo "### Test coverage"
            echo '```'
            go tool cover -func=coverage.out | tail -n 25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Fuzzing feeds random input to one function (the squadron-claim email checker)
  # for 20 seconds, looking for a crash. See TODO.md.
  fuzz:
    name: Fuzz (short)
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - run: go test ./internal/auth -run '^$' -fuzz FuzzParseClaimEmail -fuzztime 20s

  # The one check that branch protection requires for the build and tests. It
  # passes only when every job it needs passed (or, for a notes-only change,
  # was skipped on purpose).
  build-test:
    name: Build, vet, test
    needs: [changes, build-vet, test-web, test-rest, coverage, fuzz]
    # Always run, and check the results by hand: a job whose needs failed is
    # skipped, and a skipped required check would count as passed.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every build and test job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e --arg heavy "$HEAVY" 'to_entries | all(.value.result == "success" or ($heavy != "true" and .value.result == "skipped"))' > /dev/null

  go-lint:
    name: Static analysis (staticcheck, gosec)
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      # The two tools are built once and kept; the key names their versions.
      - name: Keep the analysis tools
        id: tools
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-staticcheck-2025.1.1-gosec-v2.22.4-go1.26
      - name: Build the analysis tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
      - run: staticcheck ./...
      # Medium+ severity only. cmd/genexamples is a dev-time generator that
      # writes local files, not part of the shipped server.
      - run: gosec -severity medium -exclude-dir=cmd/genexamples ./...

  frontend-lint:
    name: Frontend lint (CSS, rendered HTML)
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Stylelint (CSS)
        # Installed into a folder of its own and pointed at with --config-basedir:
        # stylelint looks for the shared config next to the config file, not
        # in the folder npx unpacks its packages into.
        run: |
          npm install --prefix "$RUNNER_TEMP/stylelint" --no-audit --no-fund stylelint@16.10.0 stylelint-config-recommended@14.0.1
          "$RUNNER_TEMP/stylelint/node_modules/.bin/stylelint" --config-basedir "$RUNNER_TEMP/stylelint" "internal/web/static/**/*.css"
      # Templates are Go templates (HTML linters can't parse {{ }}), so
      # this boots the server and validates the rendered public pages.
      - name: html-validate (rendered pages)
        run: go run ./cmd/devtools validate-html
      # JavaScript and TypeScript are allowed as first-party files, but the
      # CSP is script-src 'self': inline <script>, inline event handlers and
      # javascript: URLs would be blocked by browsers, so catch them here.
      - name: No inline scripts or handlers in templates
        run: |
          if grep -rEn '<script' internal/web/templates | grep -v 'src="'; then
            echo "Inline <script> is blocked by the CSP; put it in internal/web/static/js/ and load it with src="; exit 1
          fi
          if grep -rEn 'javascript:| on[a-z]+="' internal/web/templates; then
            echo "Inline event handlers / javascript: URLs are blocked by the CSP; attach handlers from a script file"; exit 1
          fi
      # Strict type-check of all first-party JS (via JSDoc types) and TS.
      - name: Type-check JavaScript and TypeScript (when present)
        run: |
          if [ -n "$(git ls-files 'internal/web/static/js/*' 'internal/web/ts/*')" ]; then
            npx --yes -p typescript@5.6.3 tsc -p tsconfig.json
          else
            echo "No first-party scripts yet."
          fi
      # TypeScript sources live in internal/web/ts/ and compile into
      # internal/web/static/js/gen/, which is committed (the Docker build needs
      # no Node). Fail if the committed output is stale.
      - name: Compiled TypeScript is up to date
        run: |
          if [ -d internal/web/ts ]; then
            npx --yes -p typescript@5.6.3 tsc -p tsconfig.build.json
            git diff --exit-code -- internal/web/static/js/gen
          else
            echo "No TypeScript sources."
          fi

  browser-tests:
    name: Browser tests (Playwright)
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # The browser download is kept between runs (keyed by the locked Playwright
      # version); the system libraries it needs are installed every time.
      - name: Keep the Chromium download
        id: browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install the test tools and Chromium
        working-directory: e2e
        env:
          BROWSER_CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          npm ci --no-audit --no-fund
          if [ "$BROWSER_CACHE_HIT" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Type-check the tests
        working-directory: e2e
        run: npx tsc -p tsconfig.json
      # The tests start the real server themselves (playwright.config.ts) with a
      # throw-away database, then drive it in Chromium.
      - name: Run the browser tests
        working-directory: e2e
        run: npm test

  docs-check:
    name: Docs updated with user-visible changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      # The PR body is passed through the environment and read by the Go
      # tool as data; it is never interpolated into a shell command.
      - name: Require a docs change (or a stated reason)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: go run ./cmd/devtools docs-check

  workflow-lint:
    name: Lint GitHub workflows (actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7 -color

  govulncheck:
    name: Known-vulnerability scan (govulncheck)
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      # Built from the latest release, so the tool is kept for a week at a time
      # (the vulnerability data it checks against is always fetched fresh).
      - name: Work out this week
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Keep the scanner
        id: tool
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/go/bin
          key: govulncheck-${{ runner.os }}-go1.26-${{ steps.week.outputs.week }}
      - name: Build the scanner
        if: steps.tool.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  trivy-fs:
    name: Scan source for vulnerabilities (Trivy FS)
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          # vuln = dependencies, secret = committed credentials,
          # misconfig = Dockerfile / compose issues.
          scanners: "vuln,secret,misconfig"
          exit-code: "1"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  codeql:
    name: CodeQL (go)
    needs: changes
    runs-on: ubuntu-24.04
    if: needs.changes.outputs.heavy == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          category: "/language:go"
          # Uploading SARIF to GitHub's code-scanning UI needs GitHub
          # Advanced Security, which isn't available for a private repo on
          # this plan (confirmed: `security_and_analysis` comes back null
          # from the repos API) — upload always failed with "Code scanning
          # is not enabled for this repository", failing CI on every push
          # despite the scan itself succeeding. The analysis still runs and
          # still fails the job on its own terms; it just doesn't try to
          # push results somewhere this plan can't receive them.
          upload: false

  gate:
    if: github.event_name != 'pull_request'
    name: Promotion order (dev, then test, then main)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # to read the CI result of the commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - name: Check the commit came through the previous stage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./cmd/devtools promotion-gate

  # The image is built and checked at the same time as the tests, then only
  # pushed when every check has passed (the "build" job below), so a push waits
  # for the tests and not for the tests plus a build.
  image-meta:
    name: Work out the image name and version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      app_version: ${{ steps.meta.outputs.app_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image tags
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-12)"
          ENV_TAG="${REF_NAME}"
          # shellcheck disable=SC2153 # IMAGE_NAME is the workflow-level env var set in the `env:` block above, not a typo for IMAGE_BASE
          IMAGE_BASE="${REGISTRY}/${IMAGE_NAME}"
          {
            echo "short_sha=${SHORT_SHA}"
            echo "image_base=${IMAGE_BASE}"
            echo "image_ref=${IMAGE_BASE}:${ENV_TAG}-${SHORT_SHA}"
            echo "env_tag=${ENV_TAG}"
          } >> "$GITHUB_OUTPUT"
          # App version shown in the web/PDF footers. A release is the newest
          # frozen docs snapshot (cut by the manual Release workflow) (internal/docs/content/1.N, made with
          # "go run ./cmd/devtools docs-snapshot 1.N"), so the footer, the docs
          # version list and CHANGELOG.md always agree. main shows exactly that
          # version, as does test (which cuts it); dev adds the commit,
          # "1.N+<sha>", because it runs work that may not be released yet. Nothing here asks the GitHub API,
          # so there is no call that can fail and poison the linker flags.
          RELEASE="$(find internal/docs/content -mindepth 1 -maxdepth 1 -type d -name '1.*' -printf '%f\n' | grep -E '^1\.[0-9]+$' | sort -t. -k2 -n | tail -n 1)"
          if [ -z "$RELEASE" ]; then
            RELEASE="1.0"
          fi
          if [ "${ENV_TAG}" = "main" ] || [ "${ENV_TAG}" = "test" ]; then
            echo "app_version=${RELEASE}" >> "$GITHUB_OUTPUT"
          else
            echo "app_version=${RELEASE}+${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

  image-check:
    name: Build and check the image (not pushed)
    needs: image-meta
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build (local, for checking)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ needs.image-meta.outputs.image_ref }}
          build-args: VERSION=${{ needs.image-meta.outputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          # ALLOW_LOG_MAIL=true: the smoke container has no SMTP configured,
          # and the app now refuses to start without one unless this is set
          # (see config.RequireMail) — without it every build fails here,
          # never reaching Push.
          docker run -d --name smoke -p 18081:8080 \
            -e SESSION_KEY=ci-smoke-test-session-key-not-for-prod-use \
            -e COOKIE_SECURE=false \
            -e ALLOW_LOG_MAIL=true \
            "${{ needs.image-meta.outputs.image_ref }}"
          code=""
          for _ in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18081/health || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || { echo "/health did not return 200 (got $code)"; docker logs smoke; exit 1; }
          body="$(curl -s http://localhost:18081/health)"
          echo "$body" | grep -q '{"status": "ok"}' || { echo "/health body unexpected: $body"; docker logs smoke; exit 1; }
          docker rm -f smoke

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.image-meta.outputs.image_ref }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  build:
    needs: [image-meta, image-check, gate, build-test, go-lint, frontend-lint, browser-tests, workflow-lint, govulncheck, trivy-fs, codeql]
    # Runs when every job it needs passed or was skipped on purpose (a notes-only
    # change), and never when one failed or the run was cancelled.
    if: ${{ github.event_name != 'pull_request' && !cancelled() && !failure() }}
    name: Build, scan and push image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ needs.image-meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The layers were built (and are cached) by the image check, so this is quick.
      - name: Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ needs.image-meta.outputs.image_ref }}
          build-args: VERSION=${{ needs.image-meta.outputs.app_version }}
          cache-from: type=gha

      - name: Summary
        run: |
          echo "Pushed \`${{ needs.image-meta.outputs.image_ref }}\` — app version \`${{ needs.image-meta.outputs.app_version }}\`" >> "$GITHUB_STEP_SUMMARY"
