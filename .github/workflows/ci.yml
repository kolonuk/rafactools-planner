# Runs on every push/PR to the three long-lived branches (dev -> test ->
# main promotion via PR). Build/vet/test first since they're fast and catch
# most breakage; security scanning after.
name: CI

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [dev, test, main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build, vet, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Not gofmt'd:"; echo "$out"; exit 1; fi

  govulncheck:
    name: Known-vulnerability scan (govulncheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  trivy-fs:
    name: Scan source for vulnerabilities (Trivy FS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          exit-code: "1"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  codeql:
    name: CodeQL (go)
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          category: "/language:go"
          # Uploading SARIF to GitHub's code-scanning UI needs GitHub
          # Advanced Security, which isn't available for a private repo on
          # this plan (confirmed: `security_and_analysis` comes back null
          # from the repos API) — upload always failed with "Code scanning
          # is not enabled for this repository", failing CI on every push
          # despite the scan itself succeeding. The analysis still runs and
          # still fails the job on its own terms; it just doesn't try to
          # push results somewhere this plan can't receive them.
          upload: false
