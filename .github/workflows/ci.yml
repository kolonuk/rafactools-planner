# Runs on every push/PR to the three long-lived branches (dev -> test ->
# main promotion via PR). Build/vet/test first since they're fast and catch
# most breakage; security scanning after.
name: CI

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [dev, test, main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rafactools-planner

jobs:
  build-test:
    name: Build, vet, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # Includes the operational tests in cmd/server, which build and run
      # the real binary (startup failures, signals, restart persistence).
      - name: Test (race, coverage)
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic
      - name: Coverage summary
        run: |
          {
            echo "### Test coverage"
            echo '```'
            go tool cover -func=coverage.out | tail -n 25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fuzz (short)
        run: go test ./internal/auth -run '^$' -fuzz FuzzParseClaimEmail -fuzztime 20s
      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Not gofmt'd:"; echo "$out"; exit 1; fi

  go-lint:
    name: Static analysis (staticcheck, gosec)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - run: staticcheck ./...
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
      # Medium+ severity only. cmd/genexamples is a dev-time generator that
      # writes local files, not part of the shipped server.
      - run: gosec -severity medium -exclude-dir=cmd/genexamples ./...

  frontend-lint:
    name: Frontend lint (CSS, rendered HTML)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Stylelint (CSS)
        # Installed into a folder of its own and pointed at with --config-basedir:
        # stylelint looks for the shared config next to the config file, not
        # in the folder npx unpacks its packages into.
        run: |
          npm install --prefix "$RUNNER_TEMP/stylelint" --no-audit --no-fund stylelint@16.10.0 stylelint-config-recommended@14.0.1
          "$RUNNER_TEMP/stylelint/node_modules/.bin/stylelint" --config-basedir "$RUNNER_TEMP/stylelint" "internal/web/static/**/*.css"
      # Templates are Go templates (HTML linters can't parse {{ }}), so
      # this boots the server and validates the rendered public pages.
      - name: html-validate (rendered pages)
        run: go run ./cmd/devtools validate-html
      # JavaScript and TypeScript are allowed as first-party files, but the
      # CSP is script-src 'self': inline <script>, inline event handlers and
      # javascript: URLs would be blocked by browsers, so catch them here.
      - name: No inline scripts or handlers in templates
        run: |
          if grep -rEn '<script' internal/web/templates | grep -v 'src="'; then
            echo "Inline <script> is blocked by the CSP; put it in internal/web/static/js/ and load it with src="; exit 1
          fi
          if grep -rEn 'javascript:| on[a-z]+="' internal/web/templates; then
            echo "Inline event handlers / javascript: URLs are blocked by the CSP; attach handlers from a script file"; exit 1
          fi
      # Strict type-check of all first-party JS (via JSDoc types) and TS.
      - name: Type-check JavaScript and TypeScript (when present)
        run: |
          if [ -n "$(git ls-files 'internal/web/static/js/*' 'internal/web/ts/*')" ]; then
            npx --yes -p typescript@5.6.3 tsc -p tsconfig.json
          else
            echo "No first-party scripts yet."
          fi
      # TypeScript sources live in internal/web/ts/ and compile into
      # internal/web/static/js/gen/, which is committed (the Docker build needs
      # no Node). Fail if the committed output is stale.
      - name: Compiled TypeScript is up to date
        run: |
          if [ -d internal/web/ts ]; then
            npx --yes -p typescript@5.6.3 tsc -p tsconfig.build.json
            git diff --exit-code -- internal/web/static/js/gen
          else
            echo "No TypeScript sources."
          fi

  browser-tests:
    name: Browser tests (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install the test tools and Chromium
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Type-check the tests
        working-directory: e2e
        run: npx tsc -p tsconfig.json
      # The tests start the real server themselves (playwright.config.ts) with a
      # throw-away database, then drive it in Chromium.
      - name: Run the browser tests
        working-directory: e2e
        run: npm test

  docs-check:
    name: Docs updated with user-visible changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      # The PR body is passed through the environment and read by the Go
      # tool as data; it is never interpolated into a shell command.
      - name: Require a docs change (or a stated reason)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: go run ./cmd/devtools docs-check

  workflow-lint:
    name: Lint GitHub workflows (actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7 -color

  govulncheck:
    name: Known-vulnerability scan (govulncheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  trivy-fs:
    name: Scan source for vulnerabilities (Trivy FS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          # vuln = dependencies, secret = committed credentials,
          # misconfig = Dockerfile / compose issues.
          scanners: "vuln,secret,misconfig"
          exit-code: "1"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  codeql:
    name: CodeQL (go)
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          category: "/language:go"
          # Uploading SARIF to GitHub's code-scanning UI needs GitHub
          # Advanced Security, which isn't available for a private repo on
          # this plan (confirmed: `security_and_analysis` comes back null
          # from the repos API) — upload always failed with "Code scanning
          # is not enabled for this repository", failing CI on every push
          # despite the scan itself succeeding. The analysis still runs and
          # still fails the job on its own terms; it just doesn't try to
          # push results somewhere this plan can't receive them.
          upload: false

  gate:
    if: github.event_name != 'pull_request'
    name: Promotion order (dev, then test, then main)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # to read the CI result of the commit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - name: Check the commit came through the previous stage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./cmd/devtools promotion-gate

  build:
    needs: [gate, build-test, go-lint, frontend-lint, browser-tests, workflow-lint, govulncheck, trivy-fs, codeql]
    if: github.event_name != 'pull_request'
    name: Build, scan and push image
    runs-on: ubuntu-24.04
    permissions:
      contents: write # test only: commit the release snapshot back to the branch
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A release is a push to test. If the docs or CHANGELOG.md hold anything
      # unreleased, freeze them as the next 1.N (go run ./cmd/devtools release),
      # commit that to test and build with it. Pushes made with GITHUB_TOKEN do
      # not start another run. Moving test to main later is an ordinary push and
      # keeps the version; dev never releases.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: github.ref_name == 'test'
        with:
          go-version: "1.26"
          cache: true

      - name: Cut the release (test only)
        id: release
        if: github.ref_name == 'test'
        run: |
          go run ./cmd/devtools release | tee "$RUNNER_TEMP/release.out" >> "$GITHUB_OUTPUT"
          if grep -qx 'released=true' "$RUNNER_TEMP/release.out"; then
            VERSION="$(sed -n 's/^version=//p' "$RUNNER_TEMP/release.out")"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A internal/docs/content CHANGELOG.md
            # No [skip ci] here: a later push of this commit to main must still build and publish.
            git commit -m "release ${VERSION}: freeze the docs and changelog"
            git push origin HEAD:refs/heads/test
            RELEASE_SHA="$(git rev-parse HEAD)"
            # Bring the release commit back to dev, so the relabelled docs never
            # conflict with dev's next release. Not fatal: on a conflict, say so and
            # leave dev alone. The build below must stay on the release commit.
            git fetch origin dev
            git checkout -q -B dev-sync origin/dev
            if git merge --no-edit -m "Merge release ${VERSION} from test into dev" "${RELEASE_SHA}"; then
              git push origin HEAD:refs/heads/dev || echo "::warning::could not update dev after release ${VERSION}; merge test into dev by hand"
            else
              git merge --abort
              echo "::warning::release ${VERSION} conflicts with dev; merge test into dev by hand"
            fi
            git checkout -q "${RELEASE_SHA}"
          fi

      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-12)"
          ENV_TAG="${{ github.ref_name }}"
          # shellcheck disable=SC2153 # IMAGE_NAME is the workflow-level env var set in the `env:` block above, not a typo for IMAGE_BASE
          IMAGE_BASE="${REGISTRY}/${IMAGE_NAME}"
          {
            echo "short_sha=${SHORT_SHA}"
            echo "image_base=${IMAGE_BASE}"
            echo "image_ref=${IMAGE_BASE}:${ENV_TAG}-${SHORT_SHA}"
            echo "env_tag=${ENV_TAG}"
          } >> "$GITHUB_OUTPUT"
          # App version shown in the web/PDF footers. A release is the newest
          # frozen docs snapshot (cut on test just above) (internal/docs/content/1.N, made with
          # "go run ./cmd/devtools docs-snapshot 1.N"), so the footer, the docs
          # version list and CHANGELOG.md always agree. main shows exactly that
          # version, as does test (which cuts it); dev adds the commit,
          # "1.N+<sha>", because it runs work that may not be released yet. Nothing here asks the GitHub API,
          # so there is no call that can fail and poison the linker flags.
          RELEASE="$(find internal/docs/content -mindepth 1 -maxdepth 1 -type d -name '1.*' -printf '%f\n' | grep -E '^1\.[0-9]+$' | sort -t. -k2 -n | tail -n 1)"
          if [ -z "$RELEASE" ]; then
            RELEASE="1.0"
          fi
          if [ "${ENV_TAG}" = "main" ] || [ "${ENV_TAG}" = "test" ]; then
            echo "app_version=${RELEASE}" >> "$GITHUB_OUTPUT"
          else
            echo "app_version=${RELEASE}+${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build (local, for scanning)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.image_ref }}
          build-args: VERSION=${{ steps.meta.outputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          # ALLOW_LOG_MAIL=true: the smoke container has no SMTP configured,
          # and the app now refuses to start without one unless this is set
          # (see config.RequireMail) — without it every build fails here,
          # never reaching Push.
          docker run -d --name smoke -p 18081:8080 \
            -e SESSION_KEY=ci-smoke-test-session-key-not-for-prod-use \
            -e COOKIE_SECURE=false \
            -e ALLOW_LOG_MAIL=true \
            "${{ steps.meta.outputs.image_ref }}"
          code=""
          for _ in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18081/health || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || { echo "/health did not return 200 (got $code)"; docker logs smoke; exit 1; }
          body="$(curl -s http://localhost:18081/health)"
          echo "$body" | grep -q '{"status": "ok"}' || { echo "/health body unexpected: $body"; docker logs smoke; exit 1; }
          docker rm -f smoke

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image_ref }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
          build-args: VERSION=${{ steps.meta.outputs.app_version }}
          cache-from: type=gha

      - name: Summary
        run: |
          echo "Pushed \`${{ steps.meta.outputs.image_ref }}\` — app version \`${{ steps.meta.outputs.app_version }}\`" >> "$GITHUB_STEP_SUMMARY"
